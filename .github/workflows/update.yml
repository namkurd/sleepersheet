name: Update standings

on:
  schedule:
    # Weekly sync: every weekly data job retries hourly from Tuesday morning through Wednesday morning (UTC), because GitHub's scheduler
    # runs cron jobs hours late or skips them. Extra runs are harmless: they only commit when something changed.
    - cron: "11 8-23 * * 2"
    - cron: "11 0-12 * * 3"
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/standings.json from Sleeper
        run: python scripts/update.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/standings.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/standings.json
            git commit -m "Update standings"
            git push
          else
            echo "No changes."
          fi
