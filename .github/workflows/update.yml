name: Update standings

on:
  schedule:
    # Every Tuesday morning, Eastern time. GitHub's scheduler is best-effort and often runs
    # jobs hours late (especially on the hour), so this fires several times between 4 and 6am
    # at off-peak minutes; later runs are harmless (no change = no commit).
    # Cron is UTC-only, so it is split across the DST change:
    - cron: "11,41 8,9 * 3-10 2"       # Mar-Oct: 4:11, 4:41, 5:11, 5:41am EDT
    - cron: "11,41 9,10 * 11,12,1,2 2" # Nov-Feb: 4:11, 4:41, 5:11, 5:41am EST
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild data/standings.json from Sleeper
        run: python scripts/update.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/standings.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/standings.json
            git commit -m "Update standings"
            git push
          else
            echo "No changes."
          fi
